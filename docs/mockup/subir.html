<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23C9BCF2%22/><path d=%22M10 24V9h8l4 4v11z%22 fill=%22none%22 stroke=%22%232B2840%22 stroke-width=%222%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Subir libros — Readflow</title>
</head>
<body data-page="upload">
  <main class="page">
    <div class="container container-md">
      <a class="back" href="tablero.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg> Volver al tablero</a>

      <div style="display:flex;flex-direction:column;gap:6px">
        <h1 class="display page-title">Subir libros</h1>
        <p class="subtitle">Readflow lee el título, el autor y la portada de cada EPUB. Puedes corregirlos antes de guardar.</p>
      </div>

      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        </div>
        <p class="dropzone-title"><span class="drag-only">Arrastra aquí tus archivos EPUB</span><span class="mobile-only">Elige tus archivos EPUB</span></p>
        <p class="dropzone-sub">Uno o varios a la vez</p>
        <label class="btn btn-soft" for="files">Elegir archivos</label>
        <input class="sr-only" id="files" type="file" accept=".epub,application/epub+zip" multiple>
      </div>

      <section class="panel" id="queue" aria-labelledby="queue-title" hidden>
        <div class="panel-head">
          <h2 class="card-title" id="queue-title"></h2>
          <span class="subtitle" style="font-size:13px" id="queue-sub"></span>
        </div>
        <div id="queue-list"></div>
        <p class="hint" id="reading-hint" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg> Los libros que guardes en Reading se enviarán a tu Kindle al instante.</p>
      </section>

      <div class="queue-actions">
        <a class="btn btn-ghost" href="tablero.html">Cancelar</a>
        <button class="btn btn-primary" type="button" id="save" disabled>Agregar a la biblioteca</button>
      </div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

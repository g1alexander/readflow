<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23C9BCF2%22/><path d=%22M10 24V9h8l4 4v11z%22 fill=%22none%22 stroke=%22%232B2840%22 stroke-width=%222%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Iniciar sesión — Readflow</title>
</head>
<body data-page="login">
  <div class="login">
    <div class="login-art">
      <span class="brand"><span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2840" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 13h8M8 17h5"/></svg></span><span class="brand-name">Readflow</span></span>
      <div class="spines" aria-hidden="true">
        <span class="spine"></span><span class="spine"></span><span class="spine">Reading</span><span class="spine"></span><span class="spine"></span>
      </div>
      <div class="login-claim-wrap">
        <p class="display login-claim">Tu biblioteca, de la carpeta al Kindle.</p>
        <p class="subtitle">Sube el EPUB, mueve el libro de estado y Readflow hace el resto.</p>
      </div>
    </div>

    <main class="login-form-wrap">
      <form class="login-form" id="login-form" novalidate>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h1 class="display page-title" style="font-size:40px">Hola de nuevo</h1>
          <p class="subtitle">Entra para seguir con tus lecturas.</p>
        </div>

        <div class="field">
          <label for="email">Correo</label>
          <input class="input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <div class="row-between">
            <label for="password">Contraseña</label>
            <a href="#" style="font-size:13px;font-weight:600">¿La olvidaste?</a>
          </div>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="checkbox"><input type="checkbox" checked> Mantener la sesión en este dispositivo</label>

        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <div class="divider">o</div>
        <button class="btn btn-soft btn-block" type="button" id="magic-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg> Enviarme un enlace mágico</button>

        <p class="fineprint">Readflow es de uso personal: no hay registro de nuevas cuentas.</p>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
